<!doctype html><html lang="mt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova tal-grilja · Tisliba Maltija</title><style>*{box-sizing:border-box}body{margin:0;background:#102b40;color:#fff;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:650px;margin:auto}h2{margin:12px 0}select{font-size:18px;padding:10px;border-radius:8px}.board{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:1px;background:#6089a6;border:2px solid #6089a6}.cell{min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.block{background:#163047}.answer{background:#f7efdd;color:#142d43;font-weight:bold;font-size:clamp(12px,4vw,22px)}.clue{background:#9bb6c7;color:#19364c;font-size:clamp(5px,1.3vw,9px);font-weight:bold;overflow-wrap:anywhere;padding:1px}.clue b{position:absolute;bottom:0;right:1px;font-size:10px}p{line-height:1.5}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}.toolbar button{border:0;border-radius:8px;padding:8px 12px;background:#f4b942;color:#102b40;font-weight:bold;cursor:pointer}.status{padding:6px 9px;border-radius:999px;font-size:12px;font-weight:bold}.ok{background:#276749}.bad{background:#9b2c2c}.hidden-answer{color:transparent;text-shadow:none}</style></head><body><div class="wrap"><h2>Prova tal-grilja v4 · kontroll awtomatiku</h2><div class="toolbar"><label>Livell <select id="level"><option value="0">1</option><option value="1">2</option></select></label><button id="toggle" type="button">Aħbi t-tweġibiet</button><span id="status" class="status"></span></div><p id="stats"></p><div class="board" id="board"></div><p>Din hija biss prova tat-tqassim. Il-logħba oriġinali tibqa' kif kienet.</p></div><script>const levels=[{"words":[{"clue":"Fejn imorru t-tfal jitgħallmu?","name":"Skola","letters":["S","K","O","L","A"],"direction":"across","cells":["5,5","5,6","5,7","5,8","5,9"],"clueKey":"5,4"},{"clue":"Parti mis-siġra","name":"Werqa","letters":["W","E","R","Q","A"],"direction":"down","cells":["1,9","2,9","3,9","4,9","5,9"],"clueKey":"0,9"},{"clue":"🌳","name":"Siġra","letters":["S","I","Ġ","R","A"],"direction":"down","cells":["5,5","6,5","7,5","8,5","9,5"],"clueKey":"4,5"},{"clue":"Ilma mielaħ vast","name":"Baħar","letters":["B","A","Ħ","A","R"],"direction":"across","cells":["3,5","3,6","3,7","3,8","3,9"],"clueKey":"3,4"},{"clue":"Dak li tixrob","name":"Ilma","letters":["I","L","M","A"],"direction":"across","cells":["9,2","9,3","9,4","9,5"],"clueKey":"9,1"},{"clue":"Il-mara li wellditek","name":"Omm","letters":["O","M","M"],"direction":"down","cells":["5,7","6,7","7,7"],"clueKey":"4,7"},{"clue":"Ilma ffriżat","name":"Silġ","letters":["S","I","L","Ġ"],"direction":"down","cells":["7,3","8,3","9,3","10,3"],"clueKey":"6,3"},{"clue":"Jagħti togħma lill-ikel","name":"Melħ","letters":["M","E","L","Ħ"],"direction":"across","cells":["7,7","7,8","7,9","7,10"],"clueKey":"7,6"},{"clue":"Kulur tad-demm","name":"Aħmar","letters":["A","Ħ","M","A","R"],"direction":"down","cells":["6,10","7,10","8,10","9,10","10,10"],"clueKey":"5,10"},{"clue":"Il-kuntrarju ta’ le","name":"Iva","letters":["I","V","A"],"direction":"down","cells":["1,6","2,6","3,6"],"clueKey":"0,6"},{"clue":"🏠","name":"Dar","letters":["D","A","R"],"direction":"across","cells":["10,8","10,9","10,10"],"clueKey":"10,7"},{"clue":"Minnha jgħaddu l-karozzi","name":"Triq","letters":["T","R","I","Q"],"direction":"across","cells":["1,4","1,5","1,6","1,7"],"clueKey":"1,3"}],"stats":{"words":12,"crossings":11,"unused":70}},{"words":[{"clue":"☁️","name":"Sħab","letters":["S","Ħ","A","B"],"direction":"down","cells":["5,5","6,5","7,5","8,5"],"clueKey":"4,5"},{"clue":"🪨","name":"Ġebla","letters":["Ġ","E","B","L","A"],"direction":"across","cells":["8,3","8,4","8,5","8,6","8,7"],"clueKey":"8,2"},{"clue":"Ħuta waħda","name":"Ħuta","letters":["Ħ","U","T","A"],"direction":"across","cells":["6,5","6,6","6,7","6,8"],"clueKey":"6,4"},{"clue":"✉️","name":"Ittra","letters":["I","T","T","R","A"],"direction":"down","cells":["4,7","5,7","6,7","7,7","8,7"],"clueKey":"3,7"},{"clue":"Flus u beni","name":"Ġid","letters":["Ġ","I","D"],"direction":"down","cells":["8,3","9,3","10,3"],"clueKey":"7,3"},{"clue":"Il-kuntrarju ta’ iva","name":"Le","letters":["L","E"],"direction":"down","cells":["8,6","9,6"],"clueKey":"7,6"},{"clue":"Kulur tal-ħaxix","name":"Aħdar","letters":["A","Ħ","D","A","R"],"direction":"across","cells":["10,1","10,2","10,3","10,4","10,5"],"clueKey":"10,0"},{"clue":"Frott aħmar","name":"Frawla","letters":["F","R","A","W","L","A"],"direction":"down","cells":["5,1","6,1","7,1","8,1","9,1","10,1"],"clueKey":"4,1"},{"clue":"🐭","name":"Far","letters":["F","A","R"],"direction":"across","cells":["5,1","5,2","5,3"],"clueKey":"5,0"},{"clue":"👩","name":"Mara","letters":["M","A","R","A"],"direction":"down","cells":["2,2","3,2","4,2","5,2"],"clueKey":"1,2"},{"clue":"Annimal li jtajjar","name":"Għasfur","letters":["GĦ","A","S","F","U","R"],"direction":"across","cells":["3,1","3,2","3,3","3,4","3,5","3,6"],"clueKey":"3,0"},{"clue":"🔥","name":"Nar","letters":["N","A","R"],"direction":"down","cells":["1,6","2,6","3,6"],"clueKey":"0,6"},{"clue":"Kulur tal-borra","name":"Abjad","letters":["A","B","J","A","D"],"direction":"across","cells":["2,6","2,7","2,8","2,9","2,10"],"clueKey":"2,5"}],"stats":{"words":13,"crossings":13,"unused":66}}];let answersVisible=true;function validate(l){const occ=new Map(),wordCells=new Set();for(const w of l.words){if(w.cells.length!==w.letters.length)return 'Tul ħażin f’ '+w.name;wordCells.add(w.direction+':'+w.cells.join('|'));for(let i=0;i<w.cells.length;i++){const k=w.cells[i],ch=w.letters[i];if(occ.has(k)&&occ.get(k).ch!==ch)return 'Ittri differenti f’ '+k;if(!occ.has(k))occ.set(k,{ch,dirs:new Set});occ.get(k).dirs.add(w.direction)}}const starts=[['across',0,1],['down',1,0]];for(const [dir,dr,dc] of starts){for(const k of occ.keys()){const [r,c]=k.split(',').map(Number),prev=(r-dr)+','+(c-dc);if(occ.has(prev))continue;let cells=[],rr=r,cc=c;while(occ.has(rr+','+cc)){cells.push(rr+','+cc);rr+=dr;cc+=dc}if(cells.length>1&&!wordCells.has(dir+':'+cells.join('|')))return 'Sekwenza mhux intenzjonata: '+cells.join(' ')}}const seen=new Set([l.words[0].name]),queue=[l.words[0]];while(queue.length){const a=queue.shift();for(const b of l.words)if(!seen.has(b.name)&&a.cells.some(x=>b.cells.includes(x))){seen.add(b.name);queue.push(b)}}return seen.size===l.words.length?'OK':('Kliem mhux konness: '+(l.words.length-seen.size))}function draw(){let l=levels[+document.getElementById('level').value],clues=new Map(),letters=new Map();l.words.forEach(w=>{clues.set(w.clueKey,w);w.cells.forEach((k,i)=>letters.set(k,w.letters[i]))});let board=document.getElementById('board');board.replaceChildren();for(let r=0;r<11;r++)for(let c=0;c<11;c++){let k=r+','+c,w=clues.get(k),d=document.createElement('div');d.className='cell '+(w?'clue':letters.has(k)?'answer':'block');if(w){d.textContent=w.clue;let b=document.createElement('b');b.textContent=w.direction==='down'?'↓':'→';d.append(b)}else if(letters.has(k)){d.textContent=letters.get(k);if(!answersVisible)d.classList.add('hidden-answer')}board.append(d)}let result=validate(l),s=document.getElementById('status');s.textContent=result==='OK'?'✓ Grilja valida':result;s.className='status '+(result==='OK'?'ok':'bad');document.getElementById('stats').textContent=l.stats.words+' kelma · '+l.stats.crossings+' intersezzjonijiet · '+l.stats.unused+' kaxxa mhux użata'}document.getElementById('level').addEventListener('change',draw);document.getElementById('toggle').addEventListener('click',()=>{answersVisible=!answersVisible;document.getElementById('toggle').textContent=answersVisible?'Aħbi t-tweġibiet':'Uri t-tweġibiet';draw()});draw();</script></body></html>
