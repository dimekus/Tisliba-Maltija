<!doctype html><html lang="mt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prova tal-grilja · Tisliba Maltija</title><style>*{box-sizing:border-box}body{margin:0;background:#102b40;color:#fff;font-family:Arial,sans-serif;padding:12px}.wrap{max-width:650px;margin:auto}h2{margin:12px 0}select{font-size:18px;padding:10px;border-radius:8px}.board{display:grid;grid-template-columns:repeat(11,1fr);aspect-ratio:1;gap:1px;background:#6089a6;border:2px solid #6089a6}.cell{min-width:0;display:flex;align-items:center;justify-content:center;text-align:center;position:relative;overflow:hidden}.block{background:#163047}.answer{background:#f7efdd;color:#142d43;font-weight:bold;font-size:clamp(12px,4vw,22px)}.clue{background:#9bb6c7;color:#19364c;font-size:clamp(5px,1.3vw,9px);font-weight:bold;overflow-wrap:anywhere;padding:1px}.clue b{position:absolute;bottom:0;right:1px;font-size:10px}p{line-height:1.5}</style></head><body><div class="wrap"><h2>Prova tal-grilja (mhux il-logħba uffiċjali)</h2><label>Livell <select id="level"><option value="0">1</option><option value="1">2</option></select></label><p id="stats"></p><div class="board" id="board"></div><p>Din hija biss prova tat-tqassim. Il-logħba oriġinali tibqa' kif kienet.</p></div><script>const levels=[{"words":[{"clue":"Kulur tad-demm","name":"Aħmar","letters":["A","Ħ","M","A","R"],"direction":"across","cells":["5,3","5,4","5,5","5,6","5,7"],"clueKey":"5,2"},{"clue":"🌳","name":"Siġra","letters":["S","I","Ġ","R","A"],"direction":"down","cells":["1,3","2,3","3,3","4,3","5,3"],"clueKey":"0,3"},{"clue":"Il-mara li wellditek","name":"Omm","letters":["O","M","M"],"direction":"down","cells":["3,5","4,5","5,5"],"clueKey":"2,5"},{"clue":"Ilma mielaħ vast","name":"Baħar","letters":["B","A","Ħ","A","R"],"direction":"down","cells":["2,6","3,6","4,6","5,6","6,6"],"clueKey":"1,6"},{"clue":"Fejn imorru t-tfal jitgħallmu?","name":"Skola","letters":["S","K","O","L","A"],"direction":"acros "clue":"Ilma ffriżat","name":"Silġ","letters":["S","I","L","Ġ"],"direction":"down","cells":["1,1","2,1","3,1","4,1"],"clueKey":"0,1"},{"clue":"🏠","name":"Dar","letters":["D","A","R"],"direction":"across","cells":["6,2","6,3","6,4"],"clueKey":"6,1"}],"stats":{"words":21,"crossings":10,"unused":22}},{"words":[{"clue":"🐘","name":"Kbir","letters":["K","B","I","R"],"direction":"down","cells":["3,8","4,8","5,8","6,8"],"clueKey":"2,8"},{"clue":"👩","name":"Mara","letters":["M","A","R","A"],"direction":"across","cells":["6,6","6,7","6,8","6,9"],"clueKey":"6,5"},{"clue":"🐜","name":"Nemla","letters":["N","E","M","L","A"],"direction":"down","cells":["4,6","5,6","6,6","7,6","8,6"],"clueKey":"3,6"},{"clue":"Kulur tal-ħaxix","name":"Aħdar","letters":["A","Ħ","D","A","R"],"direction":"across","cells":["8,6","8,7","8,8","8,9","8,10"],"clueKey":"8,5"},{"clue":"🛋️","name":"Sufan","letters":["S","U","F","A","N"],"direction":"across","cells":["4,2","4,3","4,4","4,5","4,6"],"clueKey":"4,1"},{"clue":"Kulur tal-borra","name":"Abjad","letters":["A","B","J","A","D"],"direction":"down","cells":["1,5","2,5","3,5","4,5","5,5"],"clueKey":"0,5"},{"clue":"Annimal li jtajjar","name":"Għasfur","letters":["GĦ","A","S","F","U","R"],"direction":"down","cells":["3,10","4,10","5,10","6,10","7,10","8,10"],"clueKey":"2,10"},{"clue":"Il-kuntrarju ta’ kiesaħ","name":"Sħun","letters":["S","Ħ","U","N"],"direction":"down","cells":["4,2","5,2","6,2","7,2"],"clueKey":"3,2"},{"clue":"Ħuta waħda","name":"Ħuta","letters":["Ħ","U","T","A"],"direction":"down","cells":["3,3","4,3","5,3","6,3"],"clueKey":"2,3"},{"clue":"🪨","name":"Ġebla","letters":["Ġ","E","B","L","A"],"direction":"across","cells":["1,1","1,2","1,3","1,4","1,5"],"clueKey":"1,0"},{"clue":"Flus u beni","name":"Ġid","letters":["Ġ","I","D"],"direction":"down","cells":["1,1","2,1","3,1"],"clueKey":"0,1"},{"clue":"✉️","name":"Ittra","letters":["I","T","T","R","A"],"direction":"down","cells":["2,9","3,9","4,9","5,9","6,9"],"clueKey":"1,9"},{"clue":"Dak li nixo
