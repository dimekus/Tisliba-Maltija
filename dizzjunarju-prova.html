<!doctype html>
<html lang="mt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reviżjoni tad-Dizzjunarju · Tisliba Maltija</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#102b40;color:#fff;font-family:Arial,sans-serif;padding:16px}.wrap{max-width:1050px;margin:auto}
h1{font-size:clamp(22px,5vw,34px);margin:8px 0}.note{color:#dce8f0;line-height:1.5}.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
input,select{font:inherit;padding:10px;border-radius:9px;border:1px solid #7198b3;min-width:180px}.count{background:#e9bd68;color:#142d43;padding:10px 13px;border-radius:9px;font-weight:bold}
.table{overflow:auto;border-radius:12px;border:1px solid #6089a6}table{width:100%;border-collapse:collapse;background:#18364d}th{position:sticky;top:0;background:#294963;text-align:left}
th,td{padding:10px;border-bottom:1px solid #52758d;vertical-align:top}.word{font-weight:900;font-size:18px}.tokens{display:flex;gap:3px;flex-wrap:wrap}
.token{background:#f7efdd;color:#142d43;min-width:28px;text-align:center;padding:5px;border-radius:5px;font-weight:bold}
.review{color:#ffd47a;font-weight:bold}.approved{color:#a9e5b2;font-weight:bold}@media(max-width:650px){.hide-mobile{display:none}th,td{padding:8px 6px;font-size:13px}.word{font-size:16px}}
</style></head><body><main class="wrap"><h1>Reviżjoni tad-Dizzjunarju</h1>
<p class="note">Din il-paġna turi l-bank intern; mhix parti mil-logħba. “Kaxxi” turi kif il-kelma tinqasam fil-grilja.</p>
<div class="tools"><input id="search" placeholder="Fittex kelma jew ħjiel…"><select id="category"><option value="">Il-kategoriji kollha</option></select><span class="count" id="count">Qed jitgħabba…</span></div>
<div class="table"><table><thead><tr><th>Kelma</th><th>Kaxxi</th><th>Kategorija</th><th>Ħjiel</th><th class="hide-mobile">Status</th></tr></thead><tbody id="rows"></tbody></table></div>
</main><script>
let bank=[];const rows=document.getElementById('rows'),search=document.getElementById('search'),category=document.getElementById('category'),count=document.getElementById('count');
function draw(){const q=search.value.trim().toLocaleUpperCase('mt'),cat=category.value;const list=bank.filter(w=>(!cat||w.category===cat)&&(!q||w.answer.includes(q)||(w.clues.easy||'').toLocaleUpperCase('mt').includes(q)));rows.replaceChildren();for(const w of list){const tr=document.createElement('tr');const cells=[['word',w.answer],['tokens',''],['',w.category],['',w.clues.easy],['hide-mobile '+(w.status.includes('approvata')?'approved':'review'),w.status.replaceAll('-',' ')]];for(const [cls,text] of cells){const td=document.createElement('td');td.className=cls;if(cls==='tokens')for(const token of w.tokens){const s=document.createElement('span');s.className='token';s.textContent=token;td.append(s)}else td.textContent=text;tr.append(td)}rows.append(tr)}count.textContent=list.length+' minn '+bank.length}
fetch('data/word-bank.json?review=1').then(r=>r.json()).then(data=>{bank=data.words;const cats=[...new Set(bank.map(w=>w.category))].sort();for(const c of cats){const o=document.createElement('option');o.value=c;o.textContent=c;category.append(o)}draw()}).catch(()=>count.textContent='Ma setax jitgħabba');
search.addEventListener('input',draw);category.addEventListener('change',draw);
</script></body></html>
