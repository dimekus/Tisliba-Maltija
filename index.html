document.getElementById('verify').onclick=()=>{const cells=pending();if(!cells.length){say('Poġġi mill-inqas ittra waħda qabel Iċċekkja.');return}const completedBefore=new Set(words.filter(w=>w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i])));let good=0,bad=0;const usedAll=available().length===0&&cells.length===5;for(const c of cells){delete c.dataset.pending;if(c.textContent===solution[c.dataset.key]){good++;c.dataset.locked='1';c.dataset.user='1';delete c.dataset.help;c.classList.add('good');const spent=findTile(c.dataset.tileId);if(spent)spent.closest('.tile-slot').remove();delete c.dataset.tileId}else{bad++;returnTile(c);c.textContent='';c.classList.remove('long','bad','good');c.style.color=''}}const bonus=usedAll&&bad===0?5:0;const completedNow=words.filter(w=>!completedBefore.has(w)&&w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i]));const wordBonus=completedNow.reduce((sum,w)=>sum+w.letters.length,0);const turnPoints=good-bad+bonus+wordBonus;total+=turnPoints;tiles.querySelectorAll('.tile[disabled]').forEach(t=>t.closest('.tile-slot').remove());turn++;hintsUsed=0;updateJoker();refill();selectedCell=null;answers.forEach(c=>c.classList.remove('sel'));say('Turn lest: +'+good+' korretti'+(bad?', −'+bad+' żbaljati':'')+(bonus?', +5 bonus tal-ħames ittri!':'')+(wordBonus?', +'+wordBonus+' bonus tal-kliem!':'')+'.');const done=refresh();if(done===words.length){showEnd()}else{document.getElementById('endActions').classList.remove('open');document.getElementById('card').classList.remove('pic');document.getElementById('bigClue').textContent='Punti f’dan it-turn: '+(turnPoints>=0?'+':'')+turnPoints;document.getElementById('bigArrow').textContent=(wordBonus?'Bonus tal-kliem: +'+wordBonus+' · ':'')+'Punti totali: '+total;modal.classList.add('open')}};
function updateJoker(){const j=document.getElementById('hint');document.getElementById('jokerCount').textContent=hintsUsed<3?(hintsUsed+1)+'/3':'3/3';j.disabled=hintsUsed>=3;j.setAttribute('aria-label',hintsUsed<3?'Joker '+(hintsUsed+1)+' minn 3':'Intużaw it-3 jokers tat-turn')}
function revealHint(c){if(!c||c.dataset.locked==='1'||hintsUsed>=3)return;const letter=solution[c.dataset.key];if(c.dataset.pending==='1')clearCell(c);const available=[...tiles.querySelectorAll('.tile')].find(t=>!t.disabled&&t.dataset.letter===letter);if(available)available.closest('.tile-slot').remove();c.textContent=letter;c.classList.toggle('long',letter.length>1);c.dataset.locked='1';c.dataset.help='1';delete c.dataset.user;delete c.dataset.pending;delete c.dataset.tileId;c.classList.remove('bad');c.classList.add('good');hintsUsed++;updateJoker();selectedCell=null;answers.forEach(x=>x.classList.remove('sel'));say('Joker '+hintsUsed+'/3: ittra żvelata (bla punti).');refresh()}
(function bindJoker(){const j=document.getElementById('hint');j.addEventListener('pointerdown',e=>{if(j.disabled||(e.pointerType==='mouse'&&e.button!==0))return;drag={joker:true,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{j.setPointerCapture(e.pointerId)}catch(_){}});j.addEventListener('pointermove',e=>{if(!drag||!drag.joker||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;ghost=document.createElement('div');ghost.className='drag-ghost joker-ghost';ghost.textContent='🃏';document.body.appendChild(ghost)}answers.forEach(c=>c.classList.remove('drop-target'));const c=dragTarget(e);showDragPreview(e.clientX,e.clientY,'🃏',c);if(c){c.classList.add('drop-target');ghost.classList.add('valid')}else ghost.classList.remove('valid');e.preventDefault()});j.addEventListener('pointerup',e=>{if(!drag||!drag.joker)return;const c=drag.moved?dragTarget(e):null;clearDrag();if(c)revealHint(c)});j.addEventListener('pointercancel',clearDrag)})();updateJoker();
function showEnd(){const finalLevel=activePuzzle===puzzles.length-1,panel=document.getElementById('inlineEnd');document.getElementById('verify').style.display='none';document.getElementById('inlineEndTitle').textContent=completedWithHelp?'Il-livell tlesta, imma bi ftit għajnuna.':(finalLevel?'Prosit! Lestejt il-'+puzzles.length+' livelli!':'Prosit! Lestejt il-livell!');document.getElementById('inlineEndScore').textContent='Punti totali: '+total+(completedWithHelp?' · −'+helpPenalty+' għall-għajnuna':'');document.getElementById('inlineEndQuestion').textContent=finalLevel?'Trid terġa’ tibda mil-Livell 1?':'Trid tkompli għal-Livell '+(activePuzzle+2)+'?';document.getElementById('inlineNewPuzzle').textContent=finalLevel?'Erġa’ ibda':'Iva, kompli';panel.classList.add('open')}
function loadPuzzle(index){hintsUsed=0;updateJoker();const restarting=activePuzzle===puzzles.length-1&&index===0;activePuzzle=index;if(restarting)total=0;words=puzzles[index].words;solution=puzzles[index].solution;document.querySelector('.level').textContent=rankNames[index]+' · '+(index+1);buildBoard();answers=[...document.querySelectorAll('.answer')];byKey=Object.fromEntries(answers.map(c=>[c.dataset.key,c]));bindAnswerCells();bindClues();tiles.innerHTML='';selectedCell=null;selectedTile=null;turn=1;won=false;completedWithHelp=false;helpPenalty=0;explainMode=false;explainWordIndex=-1;document.getElementById('board').classList.remove('explain-mode');document.getElementById('endActions').classList.remove('open');document.getElementById('inlineEnd').classList.remove('open');document.getElementById('verify').style.display='';modal.classList.remove('open');refill();refresh();fitMobileBoard();say(index===0?'Mexxi l-ittri bil-mess jew drag-and-drop, imbagħad agħfas Iċċekkja.':'')}
document.getElementById('solve').onclick=()=>{const userCells=pending();let good=0,bad=0;userCells.forEach(c=>{if(c.textContent===solution[c.dataset.key])good++;else bad++});const playerKeys=new Set(answers.filter(c=>c.dataset.user==='1'||(c.dataset.pending==='1'&&c.textContent===solution[c.dataset.key])).map(c=>c.dataset.key)),playerCorrect=playerKeys.size,remainingWords=words.filter(w=>!w.cells.every(k=>playerKeys.has(k))).length;helpPenalty=playerCorrect<=5?15:Math.min(10,remainingWords);completedWithHelp=true;total+=good-bad-helpPenalty;answers.forEach(c=>{c.textContent=solution[c.dataset.key];c.classList.toggle('long',c.textContent.length>1);c.classList.remove('bad','sel');c.classList.add('good');c.dataset.locked='1';delete c.dataset.pending;delete c.dataset.tileId});tiles.innerHTML='';selectedCell=null;selectedTile=null;refresh();say('Il-livell tlesta bi ftit għajnuna. Tnaqqsu '+helpPenalty+' punti.');showEnd()};
function wordAtPoint(x,y){const el=document.elementFromPoint(x,y),cell=el&&el.closest&&el.closest('.answer');if(!cell)return-1;const key=cell.dataset.key,candidates=words.map((w,i)=>({w,i})).filter(o=>o.w.cells.includes(key));if(!candidates.length)return-1;if(candidates.length===1)return candidates[0].i;const dx=x-explainLastX,dy=y-explainLastY,prefer=Math.abs(dx)>Math.abs(dy)?'across':'down';return(candidates.find(o=>o.w.direction===prefer)||candidates[0]).i}
function highlightExplainWord(i){explainWordIndex=i;answers.forEach(c=>c.classList.remove('explain-highlight'));if(i>=0)words[i].cells.forEach(k=>byKey[k]&&byKey[k].classList.add('explain-highlight'))}
function openWordInfo(i){const w=words[i],visual=w.clue,isImage=/\.(?:png|webp|jpe?g)(?:\?|$)/i.test(visual),isEmoji=/^\p{Extended_Pictographic}/u.test(visual),box=document.getElementById('eduImage');box.replaceChildren();if(isImage){const img=document.createElement('img');img.src=visual;img.alt=w.name;box.append(img)}else if(isEmoji){const e=document.createElement('div');e.className='emoji';e.textContent=visual;box.append(e)}document.getElementById('eduWord').textContent=w.name;const tokens=document.getElementById('eduTokens');tokens.replaceChildren();w.letters.forEach(t=>{const x=document.createElement('span');x.textContent=t;tokens.append(x)});document.getElementById('eduMeaning').textContent=w.detailClue||(!isImage&&!isEmoji?visual:'It-tifsira għadha trid tiżdied.');document.getElementById('eduEnglish').textContent=w.english||'Għadha trid tiżdied u tiġi vverifikata.';const wrap=document.getElementById('eduEtymologyWrap');wrap.style.display=w.etymology?'block':'none';document.getElementById('eduEtymology').textContent=w.etymology||'';document.getElementById('eduModal').classList.add('open')}
function startExplain(){explainMode=true;explainWordIndex=-1;const board=document.getElementById('board');board.classList.add('explain-mode');document.getElementById('inlineEndQuestion').textContent='Agħżel kelma mit-tisliba.';say('Mexxi subgħajk fuq kelma u agħfas biex tara t-tifsira.')}
(function bindExplain(){const board=document.getElementById('board');board.addEventListener('pointerdown',e=>{if(!explainMode)return;explainLastX=e.clientX;explainLastY=e.clientY;highlightExplainWord(wordAtPoint(e.clientX,e.clientY));e.preventDefault()});board.addEventListener('pointermove',e=>{if(!explainMode)return;const i=wordAtPoint(e.clientX,e.clientY);highlightExplainWord(i);explainLastX=e.clientX;explainLastY=e.clientY;e.preventDefault()});board.addEventListener('pointerup',e=>{if(!explainMode)return;const i=wordAtPoint(e.clientX,e.clientY);highlightExplainWord(i);if(i>=0)openWordInfo(i);e.preventDefault()});document.getElementById('explainWords').onclick=startExplain;document.getElementById('eduClose').onclick=()=>document.getElementById('eduModal').classList.remove('open');document.getElementById('eduModal').onclick=e=>{if(e.target.id==='eduModal')e.currentTarget.classList.remove('open')}})();
function finishGameSession(){modal.classList.remove('open');document.getElementById('inlineEnd').classList.remove('open');document.querySelector('.app').style.display='none';document.getElementById('goodbye').classList.add('open')}
function restartGameSession(){document.getElementById('goodbye').classList.remove('open');document.querySelector('.app').style.display='flex';total=0;puzzles=generateGamePuzzles();loadPuzzle(0)}
document.getElementById('newPuzzle').onclick=()=>loadPuzzle((activePuzzle+1)%puzzles.length);document.getElementById('finishGame').onclick=finishGameSession;document.getElementById('inlineNewPuzzle').onclick=()=>loadPuzzle((activePuzzle+1)%puzzles.length);document.getElementById('inlineFinishGame').onclick=finishGameSession;document.getElementById('restartGame').onclick=restartGameSession;
function bindClues(){document.querySelectorAll('.clue').forEach(c=>c.addEventListener('click',()=>{const w=words[+c.dataset.word],visual=w.clue,isImage=/\.(?:png|webp|jpe?g)(?:\?|$)/i.test(visual),isEmoji=/^\p{Extended_Pictographic}/u.test(visual),big=document.getElementById('bigClue'),card=document.getElementById('card');document.getElementById('endActions').classList.remove('open');big.replaceChildren();card.classList.toggle('pic',isImage||isEmoji);if(isImage){const img=document.createElement('img');img.src=visual;img.alt=w.name||'Ħjiel bi stampa';big.append(img)}else big.textContent=visual;document.getElementById('bigArrow').textContent=w.direction==='across'?'→':'↓';modal.classList.add('open')}))}bindClues();
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};refill();refresh();fitMobileBoard();say('Mexxi l-ittri bid-drag-and-drop, imbagħad agħfas Iċċekkja.');
})();</script>
