function buildBoard(){const board=document.getElementById('board');board.replaceChildren();const clues=new Map(words.map((w,i)=>[w.clueKey,{w,i}])),letters=new Set(words.flatMap(w=>w.cells));for(let r=0;r<11;r++)for(let c=0;c<11;c++){const key=r+','+c,cl=clues.get(key);let el;if(cl){el=document.createElement('button');el.type='button';const isPic=/^\p{Extended_Pictographic}/u.test(cl.w.clue),clueLen=[...cl.w.clue].length,sizeClass=clueLen<=12?' clue-short':clueLen<=26?' clue-medium':' clue-long';const touching=(clues.has(r+','+(c-1))?' clue-touch-left':'')+(clues.has((r-1)+','+c)?' clue-touch-top':'');el.className='cell clue '+cl.w.direction+(isPic?' pic':'')+sizeClass+touching;el.dataset.word=cl.i;const span=document.createElement('span');span.textContent=cl.w.clue;const arrow=document.createElement('b');arrow.textContent=cl.w.direction==='across'?'→':'↓';el.append(span,arrow)}else if(letters.has(key)){el=document.createElement('button');el.type='button';el.className='cell answer';el.dataset.key=key}else{el=document.createElement('div');el.className='cell block'}board.append(el)}requestAnimationFrame(fitClues)}
function fitClues(){document.querySelectorAll('.clue:not(.pic) span').forEach(span=>{span.style.fontSize='';let size=parseFloat(getComputedStyle(span).fontSize),guard=0;while((span.scrollHeight>span.clientHeight+1||span.scrollWidth>span.clientWidth+1)&&size>5&&guard++<20){size-=.4;span.style.fontSize=size+'px'}})}

let answers=[...document.querySelectorAll('.answer')],byKey=Object.fromEntries(answers.map(c=>[c.dataset.key,c]));const tiles=document.getElementById('tiles'),tip=document.getElementById('tip'),progress=document.getElementById('progress'),totalScore=document.getElementById('totalScore'),modal=document.getElementById('modal');
let selectedCell=null,selectedTile=null,drag=null,ghost=null,dropPreview=null,turn=1,total=0,won=false,serial=0,suppressClickUntil=0,hintMode=false,hintsUsed=0;
function fitMobileBoard(){if(!window.matchMedia('(pointer:coarse)').matches)return;const app=document.querySelector('.app'),board=document.getElementById('board');if(!app||!board)return;const vh=window.visualViewport?window.visualViewport.height:window.innerHeight;const sections=[app.querySelector('header'),document.querySelector('.verify-row'),document.querySelector('.panel'),document.querySelector('.solve-row')];let used=0;sections.forEach(el=>{if(el){const st=getComputedStyle(el);used+=el.getBoundingClientRect().height+parseFloat(st.marginTop||0)+parseFloat(st.marginBottom||0)}});const padding=12;const size=Math.max(155,Math.min(window.innerWidth-12,vh-used-padding));document.documentElement.style.setProperty('--mobile-board-size',size+'px')}window.addEventListener('resize',fitMobileBoard);if(window.visualViewport)window.visualViewport.addEventListener('resize',fitMobileBoard);const say=s=>tip.textContent=s;
function available(){return [...tiles.querySelectorAll('.tile:not([disabled])')]}

function select(c){answers.forEach(x=>x.classList.remove('sel'));selectedCell=c;c.classList.add('sel')}
function refresh(){const done=words.filter(w=>w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i])).length;progress.textContent='Turn '+turn+' | Kliem: '+done+'/'+words.length;totalScore.textContent='Punti: '+total;if(done===words.length&&!won){won=true;say('Prosit! Lestejt il-livell b’'+total+' punti! 🎉')}return done}
function createTile(letter){let slot=document.createElement('div');slot.className='tile-slot';let t=document.createElement('button');t.type='button';t.className='tile'+(letter.length>1?' long':'');t.dataset.letter=letter;t.dataset.tileId='t'+(++serial);t.textContent=letter;slot.appendChild(t);tiles.appendChild(slot);bind(t)}
function refill(){let pool=answers.filter(c=>c.dataset.locked!=='1').map(c=>solution[c.dataset.key]);tiles.querySelectorAll('.tile').forEach(t=>{const i=pool.indexOf(t.dataset.letter);if(i!==-1){pool.splice(i,1)}else{t.closest('.tile-slot').remove()}});const missing=5-tiles.querySelectorAll('.tile').length;for(let i=0;i<missing&&pool.length;i++){const letter=pool.splice(Math.floor(Math.random()*pool.length),1)[0];createTile(letter)}}
function findTile(id){return [...tiles.querySelectorAll('.tile')].find(t=>t.dataset.tileId===id)}
function returnTile(c){if(!c.dataset.tileId)return;const t=findTile(c.dataset.tileId);if(t){t.disabled=false;t.style.visibility='';t.closest('.tile-slot').classList.remove('used')}delete c.dataset.tileId}
function clearCell(c){returnTile(c);c.textContent='';delete c.dataset.pending;c.classList.remove('long','good','bad')}
function place(t,c){if(!t||!c||c.dataset.locked==='1')return;if(c.dataset.pending==='1')clearCell(c);c.textContent=t.dataset.letter;c.classList.toggle('long',t.dataset.letter.length>1);c.classList.remove('good','bad');c.dataset.tileId=t.dataset.tileId;c.dataset.pending='1';t.disabled=true;t.style.visibility='hidden';t.closest('.tile-slot').classList.add('used');selectedTile=null;select(c);say('Meta tkun lest, agħfas Iċċekkja.');refresh()}
function target(x,y){let e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('.answer:not([data-locked="1"])'):null}
function overRack(x,y){const rack=tiles.getBoundingClientRect(),board=document.getElementById('board').getBoundingClientRect();return y>=rack.top-35&&y<=rack.bottom+65&&x>=rack.left-40&&x<=rack.right+40||y>board.bottom+20&&y<window.innerHeight-25}
function clearDrag(){if(drag&&drag.t)drag.t.style.opacity='';if(drag&&drag.c)drag.c.style.color='';answers.forEach(c=>c.classList.remove('drop-target'));if(ghost){ghost.remove();ghost=null}drag=null}
function dragTarget(e){const board=document.getElementById('board'),rect=board.getBoundingClientRect();const cellSize=rect.width/11;const x=e.clientX,y=e.clientY-(e.pointerType==='touch'?75:58);if(x<rect.left-cellSize*.25||x>rect.right+cellSize*.25||y<rect.top-cellSize*.25||y>rect.bottom+cellSize*.25)return null;let nearest=null,best=Infinity;for(const c of answers){if(c.dataset.locked==='1')continue;const b=c.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2;const d=Math.hypot(x-cx,y-cy);if(d<best){best=d;nearest=c}}return best<=cellSize*.95?nearest:null}
function showDragPreview(x,y,letter,destination){const ghostY=Math.max(28,y-58);ghost.style.left=x+'px';ghost.style.top=ghostY+'px'}
function bind(t){t.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={t,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{t.setPointerCapture(e.pointerId)}catch(_){}});
t.addEventListener('pointermove',e=>{if(!drag||drag.t!==t||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;t.style.opacity='0';ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=t.dataset.letter;document.body.appendChild(ghost)}answers.forEach(c=>c.classList.remove('drop-target'));let c=dragTarget(e);showDragPreview(e.clientX,e.clientY,t.dataset.letter,c);if(c){c.classList.add('drop-target');ghost.classList.add('valid');}else ghost.classList.remove('valid');e.preventDefault()});
t.addEventListener('pointerup',e=>{if(!drag||drag.t!==t)return;let c=drag.moved?dragTarget(e):null;clearDrag();if(c){suppressClickUntil=Date.now()+350;place(t,c)}});t.addEventListener('pointercancel',clearDrag)}
function bindAnswerCells(){answers.forEach(c=>{c.addEventListener('pointerdown',e=>{if(c.dataset.pending!=='1'||c.dataset.locked==='1'||(e.pointerType==='mouse'&&e.button!==0))return;drag={c,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(!drag||drag.c!==c||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;c.style.color='transparent';ghost=document.createElement('div');ghost.className='drag-ghost'+(c.textContent.length>1?' long':'');ghost.textContent=c.textContent;document.body.appendChild(ghost)}answers.forEach(x=>x.classList.remove('drop-target'));const destination=overRack(e.clientX,e.clientY)?null:dragTarget(e);showDragPreview(e.clientX,e.clientY,c.textContent,destination&&destination!==c?destination:null);if(destination&&destination!==c){destination.classList.add('drop-target');ghost.classList.add('valid')}else ghost.classList.remove('valid');e.preventDefault()});c.addEventListener('pointerup',e=>{if(!drag||drag.c!==c)return;const moved=drag.moved,returning=moved&&overRack(e.clientX,e.clientY),destination=moved&&!returning?dragTarget(e):null;clearDrag();if(!moved)return;suppressClickUntil=Date.now()+350;if(destination&&destination!==c){const t=findTile(c.dataset.tileId);clearCell(c);place(t,destination);say('Mexxejt l-ittra. Il-punti jinħadmu biss meta tagħfas Iċċekkja.')}else if(returning){clearCell(c);selectedCell=null;answers.forEach(x=>x.classList.remove('sel'));say('L-ittra reġgħet marret isfel. Il-punti ma nbidlux.');refresh()}});c.addEventListener('pointercancel',clearDrag)});}

document.getElementById('change').onclick=()=>{const free=available();if(!free.length){say('M’hemmx ittri ħielsa x’tibdel.');return}free.forEach(t=>t.closest('.tile-slot').remove());selectedTile=null;refill();say('Biddilt biss l-ittri li għadek ma użajtx.');refresh()};
document.getElementById('verify').onclick=()=>{const cells=pending();if(!cells.length){say('Poġġi mill-inqas ittra waħda qabel Iċċekkja.');return}const completedBefore=new Set(words.filter(w=>w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i])));let good=0,bad=0;const usedAll=available().length===0&&cells.length===5;for(const c of cells){delete c.dataset.pending;if(c.textContent===solution[c.dataset.key]){good++;c.dataset.locked='1';c.classList.add('good');const spent=findTile(c.dataset.tileId);if(spent)spent.closest('.tile-slot').remove();delete c.dataset.tileId}else{bad++;returnTile(c);c.textContent='';c.classList.remove('long','bad','good');c.style.color=''}}const bonus=usedAll&&bad===0?5:0;const completedNow=words.filter(w=>!completedBefore.has(w)&&w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i]));const wordBonus=completedNow.reduce((sum,w)=>sum+w.letters.length,0);const turnPoints=good-bad+bonus+wordBonus;total+=turnPoints;tiles.querySelectorAll('.tile[disabled]').forEach(t=>t.closest('.tile-slot').remove());turn++;hintsUsed=0;updateJoker();refill();selectedCell=null;answers.forEach(c=>c.classList.remove('sel'));say('Turn lest: +'+good+' korretti'+(bad?', −'+bad+' żbaljati':'')+(bonus?', +5 bonus tal-ħames ittri!':'')+(wordBonus?', +'+wordBonus+' bonus tal-kliem!':'')+'.');const done=refresh();if(done===words.length){showEnd()}else{document.getElementById('endActions').classList.remove('open');document.getElementById('card').classList.remove('pic');document.getElementById('bigClue').textContent='Punti f’dan it-turn: '+(turnPoints>=0?'+':'')+turnPoints;document.getElementById('bigArrow').textContent=(wordBonus?'Bonus tal-kliem: +'+wordBonus+' · ':'')+'Punti totali: '+total;modal.classList.add('open')}};
function updateJoker(){const j=document.getElementById('hint');document.getElementById('jokerCount').textContent=hintsUsed<3?(hintsUsed+1)+'/3':'3/3';j.disabled=hintsUsed>=3;j.setAttribute('aria-label',hintsUsed<3?'Joker '+(hintsUsed+1)+' minn 3':'Intużaw it-3 jokers tat-turn')}
function revealHint(c){if(!c||c.dataset.locked==='1'||hintsUsed>=3)return;const letter=solution[c.dataset.key];if(c.dataset.pending==='1')clearCell(c);const available=[...tiles.querySelectorAll('.tile')].find(t=>!t.disabled&&t.dataset.letter===letter);if(available)available.closest('.tile-slot').remove();c.textContent=letter;c.classList.toggle('long',letter.length>1);c.dataset.locked='1';delete c.dataset.pending;delete c.dataset.tileId;c.classList.remove('bad');c.classList.add('good');hintsUsed++;updateJoker();selectedCell=null;answers.forEach(x=>x.classList.remove('sel'));say('Joker '+hintsUsed+'/3: ittra żvelata (bla punti).');refresh()}
(function bindJoker(){const j=document.getElementById('hint');j.addEventListener('pointerdown',e=>{if(j.disabled||(e.pointerType==='mouse'&&e.button!==0))return;drag={joker:true,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{j.setPointerCapture(e.pointerId)}catch(_){}});j.addEventListener('pointermove',e=>{if(!drag||!drag.joker||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;ghost=document.createElement('div');ghost.className='drag-ghost joker-ghost';ghost.textContent='🃏';document.body.appendChild(ghost)}answers.forEach(c=>c.classList.remove('drop-target'));const c=dragTarget(e);showDragPreview(e.clientX,e.clientY,'🃏',c);if(c){c.classList.add('drop-target');ghost.classList.add('valid')}else ghost.classList.remove('valid');e.preventDefault()});j.addEventListener('pointerup',e=>{if(!drag||!drag.joker)return;const c=drag.moved?dragTarget(e):null;clearDrag();if(c)revealHint(c)});j.addEventListener('pointercancel',clearDrag)})();updateJoker();
function showEnd(){const finalLevel=activePuzzle===puzzles.length-1,panel=document.getElementById('inlineEnd');document.getElementById('verify').style.display='none';document.getElementById('inlineEndTitle').textContent=finalLevel?'Prosit! Lestejt il-'+puzzles.length+' livelli b’'+total+' punti!':'Prosit! Lestejt il-livell. Punti totali: '+total;document.getElementById('inlineEndQuestion').textContent=finalLevel?'Trid terġa’ tibda mil-Livell 1?':'Trid tkompli għal-Livell '+(activePuzzle+2)+'?';document.getElementById('inlineNewPuzzle').textContent=finalLevel?'Erġa’ ibda':'Iva, kompli';panel.classList.add('open')}
function loadPuzzle(index){hintsUsed=0;updateJoker();const restarting=activePuzzle===puzzles.length-1&&index===0;activePuzzle=index;if(restarting)total=0;words=puzzles[index].words;solution=puzzles[index].solution;document.querySelector('.level').textContent='Livell '+(index+1);buildBoard();answers=[...document.querySelectorAll('.answer')];byKey=Object.fromEntries(answers.map(c=>[c.dataset.key,c]));bindAnswerCells();bindClues();tiles.innerHTML='';selectedCell=null;selectedTile=null;turn=1;won=false;document.getElementById('endActions').classList.remove('open');document.getElementById('inlineEnd').classList.remove('open');document.getElementById('verify').style.display='';modal.classList.remove('open');refill();refresh();fitMobileBoard();say(index===0?'Mexxi l-ittri bil-mess jew drag-and-drop, imbagħad agħfas Iċċekkja.':'')}
