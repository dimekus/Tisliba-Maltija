<style>
:root{color-scheme:light;--bg:#102b40;--grid:#27455c;--answer:#f7efdd;--clue:#9bb6c7;--ink:#142d43;--panel:#1c3a53;--tile:#f5e7cb;--accent:#e9bd68}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background-color:var(--bg);color:#fff;font-family:Arial,sans-serif}
body{min-height:100dvh}
.app{min-height:100dvh;max-width:720px;margin:auto;padding:8px;display:flex;flex-direction:column;justify-content:flex-start;background-color:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;margin:5px 2px 8px;color:white}
header strong{font-size:clamp(21px,6vw,30px)}
.level{background-color:#294963;border:1px solid #7198b3;border-radius:14px;padding:8px 13px;font-weight:900;font-size:clamp(15px,4vw,21px);color:white}
.board{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));width:100%;aspect-ratio:1/1;background-color:var(--grid);border:2px solid #6089a6;gap:1px;border-radius:9px;overflow:hidden}
.cell{width:100%;height:100%;min-width:0;min-height:0;max-width:100%;max-height:100%;border:0;margin:0;padding:0;position:relative;overflow:hidden;border-radius:0}
.board .cell.answer{display:flex;align-items:center;justify-content:center;background-color:#f7efdd;color:#142d43;font-size:clamp(14px,5vw,25px);font-weight:900;line-height:1;white-space:nowrap;appearance:none;-webkit-appearance:none}
.board .cell.answer.long{font-size:clamp(10px,3.8vw,19px)}
.board .cell.answer.sel{outline:3px solid var(--accent);outline-offset:-3px;background-color:#fff4d9}
.board .cell.answer.drop-target{box-shadow:inset 0 0 0 4px var(--accent)}
.board .cell.clue{background-color:#9bb6c7;color:#19364c;display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;font-weight:900}
.clue span{font-size:clamp(5.5px,1.7vw,10px);line-height:1.02;overflow-wrap:normal;word-break:normal}
.clue.pic span{font-size:clamp(16px,5vw,28px);line-height:1}
.clue b{position:absolute;right:2px;bottom:0;font-size:clamp(9px,2vw,13px);color:#19364c}
.panel{margin-top:10px;background-color:#1c3a53;border-radius:20px;padding:10px}
.tiles{display:flex;align-items:center;justify-content:center;gap:7px;min-height:54px;height:54px}
.tile-slot{width:43px;height:43px;min-width:43px;flex:0 0 43px}
.tile{width:43px;height:43px;border:0;border-radius:8px;background-color:#f5e7cb;color:#142d43;box-shadow:0 4px 0 #b4a58b;font-size:22px;font-weight:900;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:3;appearance:none;-webkit-appearance:none}
.tile.long{font-size:18px}.tile.chosen{outline:4px solid var(--accent)}
.drag-ghost{position:fixed;z-index:20000;pointer-events:none;width:43px;height:43px;border-radius:8px;background-color:#f5e7cb;color:#142d43;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 4px 0 #b4a58b;opacity:.97;transform:translate(-50%,-100%)}
.drag-ghost.long{font-size:18px}
.tools{display:flex;justify-content:center;gap:9px;margin-top:11px}
.tools button{border:0;border-radius:10px;padding:10px 14px;background-color:#345f87;color:white;font-weight:900;font-size:15px;appearance:none;-webkit-appearance:none}
.tools #erase{background-color:#ad5446}.tools #hint{background-color:#d99d3f;color:#172c3c}
.tip{text-align:center;color:#dce8f0;font-weight:800;margin-top:8px;font-size:14px;min-height:34px}
.modal{position:fixed;inset:0;background:#07130fd6;display:none;align-items:center;justify-content:center;z-index:10000;padding:22px}
.modal.open{display:flex}
.card{width:min(90vw,420px);min-height:190px;background-color:#9bb6c7;color:#19364c;border:4px solid #27455c;border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative}
.card strong{font-size:clamp(25px,7vw,38px)}.card.pic strong{font-size:clamp(78px,22vw,120px)}
.card em{font-style:normal;font-size:34px;font-weight:900;color:#19364c;margin-top:10px}
.close{position:absolute;right:8px;top:4px;border:0;background:transparent;color:#19364c;font-size:34px;font-weight:900}
@media(max-height:760px){.board{max-height:62dvh}.panel{margin-top:7px}}
.answer.good{background:#d8e8db}.answer.bad{background:#f4ceca}.progress{text-align:center;margin-top:7px;font-size:13px;color:#e7e4d9}</style>

iv><button class="cell answer" data-key="10,3" aria-label="Kaxxa vojta"></button><div class="cell block"></div><button class="cell clue" data-word="4"><span>Għajn tal-wiċċ</span><b>→</b></button><button class="cell answer" data-key="10,6" aria-label="Kaxxa vojta"></button><button class="cell answer" data-key="10,7" aria-label="Kaxxa vojta"></button><button class="cell answer" data-key="10,8" aria-label="Kaxxa vojta"></button><button class="cell answer" data-key="10,9" aria-label="Kaxxa vojta"></button><div class="cell block"></div></section>

<script>(()=>{'use strict';
const words=[{"clue":"Raħal","letters":["R","A","Ħ","A","L"],"clueCell":[4,5],"direction":"down","cells":[[5,5],[6,5],[7,5],[8,5],[9,5]]},{"clue":"Kulur tad-demm","letters":["A","Ħ","M","A","R"],"clueCell":[6,4],"direction":"across","cells":[[6,5],[6,6],[6,7],[6,8],[6,9]]},{"clue":"Malta","letters":["M","A","L","T","A"],"clueCell":[5,7],"direction":"down","cells":[[6,7],[7,7],[8,7],[9,7],[10,7]]},{"clue":"Missier","letters":["M","I","S","S","IE","R"],"clueCell":[0,9],"direction":"down","cells":[[1,9],[2,9],[3,9],[4,9],[5,9],[6,9]]},{"clue":"Għajn tal-wiċċ","letters":["GĦ","A","J","N"],"clueCell":[10,5],"direction":"across","cells":[[10,6],[10,7],[10,8],[10,9]]},{"clue":"Dar","letters":["D","A","R"],"clueCell":[5,2],"direction":"across","cells":[[5,3],[5,4],[5,5]]},{"clue":"Triq","letters":["T","R","I","Q"],"clueCell":[2,6],"direction":"across","cells":[[2,7],[2,8],[2,9],[2,10]]},{"clue":"Sebat ijiem","letters":["Ġ","I","M","GĦ","A"],"clueCell":[0,4],"direction":"down","cells":[[1,4],[2,4],[3,4],[4,4],[5,4]]},{"clue":"Skola","letters":["S","K","O","L","A"],"clueCell":[8,0],"direction":"across","cells":[[8,1],[8,2],[8,3],[8,4],[8,5]]},{"clue":"Dgħajsa","letters":["D","GĦ","A","J","S","A"],"clueCell":[3,1],"direction":"down","cells":[[4,1],[5,1],[6,1],[7,1],[8,1],[9,1]]},{"clue":"Ħalib","letters":["Ħ","A","L","I","B"],"clueCell":[2,0],"direction":"across","cells":[[2,1],[2,2],[2,3],[2,4],[2,5]]},{"clue":"Omm","letters":["O","M","M"],"clueCell":[7,3],"direction":"down","cells":[[8,3],[9,3],[10,3]]},{"clue":"Ktieb","letters":["K","T","IE","B"],"clueCell":[0,7],"direction":"down","cells":[[1,7],[2,7],[3,7],[4,7]]}],solution={"5,5":"R","6,5":"A","7,5":"Ħ","8,5":"A","9,5":"L","6,6":"Ħ","6,7":"M","6,8":"A","6,9":"R","7,7":"A","8,7":"L","9,7":"T","10,7":"A","1,9":"M","2,9":"I","3,9":"S","4,9":"S","5,9":"IE","10,6":"GĦ","10,8":"J","10,9":"N","5,3":"D","5,4":"A","2,7":"T","2,8":"R","2,10":"Q","1,4":"Ġ","2,4":"I","3,4":"M","4,4":"GĦ","8,1":"S","8,2":"K","8,3":"O","8,4":"L","4,1":"D","5,1":"GĦ","6,1":"A","7,1":"J","9,1":"A","2,1":"Ħ","2,2":"A","2,3":"L","2,5":"B","9,3":"M","10,3":"M","1,7":"K","3,7":"IE","4,7":"B"};
const answers=[...document.querySelectorAll('.answer')],byKey=Object.fromEntries(answers.map(c=>[c.dataset.key,c])),tiles=document.getElementById('tiles'),tip=document.getElementById('tip'),progress=document.getElementById('progress');
let selectedCell=null,selectedTile=null,drag=null,ghost=null,cycle=0,won=false;
const say=s=>tip.textContent=s;
function select(c){answers.forEach(x=>x.classList.remove('sel'));selectedCell=c;if(c)c.classList.add('sel')}
function refresh(){let done=words.filter(w=>w.cells.every((p,i)=>byKey[p.join(',')].textContent===w.letters[i])).length;progress.textContent='Kliem korrett: '+done+' / '+words.length;if(done===words.length&&!won){won=true;say('Prosit! Lestejt it-tisliba! 🎉');document.getElementById('bigClue').textContent='Prosit! Lestejt Livell 1!';document.getElementById('bigArrow').textContent='🎉';modal.classList.add('open')}}
function next(){cycle++;tiles.innerHTML='';let pool=answers.filter(c=>c.textContent!==solution[c.dataset.key]).map(c=>solution[c.dataset.key]),picked=[];while(picked.length<5&&pool.length)picked.push(pool.splice(Math.floor(Math.random()*pool.length),1)[0]);while(picked.length<5)picked.push(['A','E','I','O','U'][Math.floor(Math.random()*5)]);picked.sort(()=>Math.random()-.5);picked.forEach(letter=>{let slot=document.createElement('div');slot.className='tile-slot';let t=document.createElement('button');t.type='button';t.className='tile'+(letter.length>1?' long':'');t.dataset.letter=letter;t.textContent=letter;slot.appendChild(t);tiles.appendChild(slot);bind(t)});selectedTile=null;say('Ċiklu '+cycle+': 5 ittri. Agħżel kaxxa jew iddreggja ittra.');refresh()}
function place(t,c){if(!t||!c)return;c.textContent=t.dataset.letter;c.classList.toggle('long',t.dataset.letter.length>1);c.classList.remove('good','bad');select(c);t.closest('.tile-slot').innerHTML='';selectedTile=null;refresh();if(!tiles.querySelector('.tile'))setTimeout(next,500)}
function target(x,y){let e=document.elementFromPoint(x,y);return e&&e.closest?e.closest('.answer'):null}
function clear(){answers.forEach(c=>c.classList.remove('drop-target'));if(ghost){ghost.remove();ghost=null}drag=null}
function bind(t){t.addEventListener('click',()=>{if(selectedCell){place(t,selectedCell);return}tiles.querySelectorAll('.tile').forEach(x=>x.classList.remove('chosen'));selectedTile=t;t.classList.add('chosen');say('Agħżel kaxxa għall-ittra '+t.dataset.letter)});t.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={t,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{t.setPointerCapture(e.pointerId)}catch(_){}});t.addEventListener('pointermove',e=>{if(!drag||drag.t!==t||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=t.dataset.letter;document.body.appendChild(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=(e.clientY-55)+'px';answers.forEach(c=>c.classList.remove('drop-target'));let c=target(e.clientX,e.clientY-55);if(c)c.classList.add('drop-target');e.preventDefault()});t.addEventListener('pointerup',e=>{if(!drag||drag.t!==t)return;let c=drag.moved?target(e.clientX,e.clientY-55):null;clear();if(c)place(t,c)});t.addEventListener('pointercancel',clear)}
answers.forEach(c=>c.addEventListener('click',()=>{select(c);if(selectedTile&&document.body.contains(selectedTile))place(selectedTile,c)}));
document.getElementById('change').onclick=next;
document.getElementById('erase').onclick=()=>{if(!selectedCell){say('Agħżel kaxxa l-ewwel.');return}selectedCell.textContent='';selectedCell.classList.remove('long','good','bad');say('L-ittra tneħħiet.');refresh()};
document.getElementById('hint').onclick=()=>{let c=selectedCell||answers.find(x=>x.textContent!==solution[x.dataset.key]);if(!c)return;c.textContent=solution[c.dataset.key];c.classList.toggle('long',c.textContent.length>1);c.classList.remove('bad');c.classList.add('good');select(c);say('Ħjiel: żvelajt ittra korretta.');refresh()};
document.getElementById('verify').onclick=()=>{let correct=0,wrong=0;answers.forEach(c=>{c.classList.remove('good','bad');if(!c.textContent)return;if(c.textContent===solution[c.dataset.key]){c.classList.add('good');correct++}else{c.classList.add('bad');wrong++}});say('Ittri korretti: '+correct+'. Żbaljati: '+wrong+'.');refresh()};
const modal=document.getElementById('modal');document.querySelectorAll('.clue').forEach(c=>c.addEventListener('click',()=>{let w=words[+c.dataset.word];document.getElementById('bigClue').textContent=w.clue;document.getElementById('bigArrow').textContent=w.direction==='across'?'→':'↓';modal.classList.add('open')}));document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};next();
})();</script>
