<html lang="mt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tisliba Maltija — Livell 1</title>
<style>
:root{--bg:#24463d;--head:#17352e;--line:#49685f;--answer:#fffaf0;--clue:#e0bd70;--block:#17352e;--panel:#315b50;--tile:#bd633f;--tileShadow:#7b3d28;--ink:#263b35}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:white}
.app{max-width:720px;margin:auto;padding:8px 8px 18px}
header{display:flex;align-items:center;justify-content:space-between;margin:6px 2px 9px}
header strong{font-size:clamp(22px,6vw,31px)} .level{background:var(--head);border:1px solid #668078;border-radius:15px;padding:9px 14px;font-weight:900;font-size:clamp(15px,4vw,21px)}
.board{display:grid;grid-template-columns:repeat(11,1fr);grid-template-rows:repeat(11,1fr);width:100%;aspect-ratio:1;background:var(--line);gap:1px;border:2px solid var(--line)}
.cell{min-width:0;min-height:0;width:100%;height:100%;border:0;border-radius:0;padding:0;overflow:hidden;position:relative}
.answer{background:var(--answer);color:var(--ink);font-weight:900;font-size:clamp(14px,4.1vw,25px)}
.answer.sel{outline:3px solid #d57a39;outline-offset:-3px} .answer.drop-target{outline:4px solid #d57a39;outline-offset:-4px}
.block{background:var(--block)}
.clue{background:var(--clue);color:#302819;display:flex;align-items:center;justify-content:center;cursor:pointer}
.clue .ico{font-size:clamp(16px,5vw,29px)} .clue .ct{display:none} .clue b{position:absolute;right:2px;bottom:0;font-size:clamp(10px,2.8vw,16px)}
.panel{margin-top:9px;background:var(--panel);border-radius:18px;padding:10px 8px 11px}
.tiles{height:clamp(42px,12vw,58px);display:flex;align-items:center;justify-content:center;gap:clamp(5px,1.8vw,10px);margin-bottom:9px}
.tile-slot{width:clamp(39px,11vw,54px);height:clamp(39px,11vw,54px);flex:0 0 auto}
.tile{width:100%;height:100%;border:0;border-radius:10px;background:var(--tile);color:white;font-size:clamp(17px,5vw,25px);font-weight:900;box-shadow:0 5px 0 var(--tileShadow);touch-action:none;user-select:none}
.tile.long{font-size:clamp(14px,4.2vw,21px)} .tile.chosen{outline:3px solid #f2cf7a}
.tile.dragging{position:fixed!important;width:clamp(39px,11vw,54px)!important;height:clamp(39px,11vw,54px)!important;z-index:9999;pointer-events:none;opacity:.92;box-shadow:0 5px 0 var(--tileShadow)}
.tools{display:flex;justify-content:center;gap:8px} .tools button{border:0;border-radius:12px;background:#e7ddc9;color:#263833;padding:9px 12px;font-weight:900;font-size:clamp(13px,3.8vw,18px)}
.tip{text-align:center;font-weight:700;font-size:clamp(12px,3.5vw,16px);margin-top:9px;min-height:20px}
.modal{display:none;position:fixed;inset:0;background:#000b;z-index:10000;align-items:center;justify-content:center;padding:25px} .modal.open{display:flex}
.card{background:#fffaf0;color:#263b35;width:min(90vw,420px);border-radius:20px;padding:24px;text-align:center} .bigIcon{font-size:52px} .bigClue{font-size:24px;font-weight:900;margin:12px 0} .bigArrow{font-size:32px} .close{margin-top:16px;border:0;border-radius:10px;padding:10px 18px;font-weight:900}

ass="cell answer" data-solution="I" aria-label="kaxxa tat-tweġiba"></button><button class="cell clue" data-word="ĦUT" aria-label="Jgħix fl-ilma"><span class="ico">🐟</span><span class="ct">Jgħix fl-ilma</span><b>→</b></button><button class="cell answer" data-solution="Ħ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="U" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="T" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="Ż" aria-label="kaxxa tat-tweġiba"></button><button class="cell clue" data-word="RAĦAL" aria-label="Post iżgħar minn belt"><span class="ico">🏘️</span><span class="ct">Post iżgħar minn belt</span><b>↓</b></button><button class="cell answer" data-solution="T" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><button class="cell clue" data-word="KELB" aria-label="L-aqwa ħabib tal-bniedem"><span class="ico">🐶</span><span class="ct">L-aqwa ħabib tal-bniedem</span><b>↓</b></button><button class="cell answer" data-solution="Ġ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="Q" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><button class="cell clue" data-word="SIĠRA" aria-label="Għandha zokk u friegħi"><span class="ico">🌳</span><span class="ct">Għandha zokk u friegħi</span><b>→</b></button><button class="cell answer" data-solution="S" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="I" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="Ġ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="R" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><button class="cell answer" data-solution="K" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="I" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><button class="cell clue" data-word="SKOLA" aria-label="Fejn nitgħallmu"><span class="ico">🏫</span><span class="ct">Fejn nitgħallmu</span><b>→</b></button><button class="cell answer" data-solution="S" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="K" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="O" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="L" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><button class="cell clue" data-word="XEMX" aria-label="Tidher fis-sema bi nhar"><span class="ico">☀️</span><span class="ct">Tidher fis-sema bi nhar</span><b>→</b></button><button class="cell answer" data-solution="X" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="E" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="M" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="X" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><div class="cell block"></div><button class="cell clue" data-word="BAĦAR" aria-label="Ilma mielaħ"><span class="ico">🌊</span><span class="ct">Ilma mielaħ</span><b>→</b></button><button class="cell answer" data-solution="B" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="Ħ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="R" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="L" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="GĦ" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><div class="cell block"></div><div class="cell block"></div><div class="cell block"></div><button class="cell clue" data-word="ĦALIB" aria-label="Xarba bajda"><span class="ico">🥛</span><span class="ct">Xarba bajda</span><b>→</b></button><button class="cell answer" data-solution="Ħ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="L" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="I" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="B" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><button class="cell clue" data-word="GĦASEL" aria-label="Jagħmluh in-naħal"><span class="ico">🍯</span><span class="ct">Jagħmluh in-naħal</span><b>→</b></button><button class="cell answer" data-solution="GĦ" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="A" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="S" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="E" aria-label="kaxxa tat-tweġiba"></button><button class="cell answer" data-solution="L" aria-label="kaxxa tat-tweġiba"></button><div class="cell block"></div><div class="cell block"></div><div class="cell block"></div><div class="cell block"></div><div class="cell block"></div></div>
<section class="panel"><div class="tiles" id="tiles"></div>
<div class="tools"><button id="change">🔀 Ibdel</button><button id="erase">⌫ Neħħi</button><button id="hint">💡 Ħjiel</button></div>
<div class="tip" id="tip">5 ittri f’dan iċ-ċiklu.</div></section></main>
<div class="modal" id="modal"><div class="card"><div class="bigIcon" id="bigIcon"></div><div class="bigClue" id="bigClue"></div><div class="bigArrow" id="bigArrow"></div><button class="close" id="close">Agħlaq</button></div></div>
<script>
(()=>{"use strict";
const bag=["Q", "A", "T", "I", "K", "L", "O", "B", "X", "L", "T", "IE", "Ħ", "K", "A", "Ġ", "S", "D", "X", "A", "S", "S", "A", "R", "R", "E", "L", "O", "U", "Ħ", "Ħ", "L", "M", "A", "Ħ", "Ġ", "A", "M", "T", "Ħ", "E", "A", "Ż", "M", "L", "E", "R", "A", "GĦ", "Ħ", "Q", "A", "K", "R", "GĦ", "I", "L", "T", "I", "T", "B", "A", "B", "I"], tiles=document.getElementById("tiles"), tip=document.getElementById("tip"), answers=[...document.querySelectorAll(".answer")];
let bagPos=0,selectedCell=null,selectedTile=null,drag=null,cycleNo=0;
function nextFive(){
 let five=[];
 for(let i=0;i<5;i++){ if(bagPos>=bag.length) bagPos=0; five.push(bag[bagPos++]); }
 cycleNo++; tiles.innerHTML="";
 five.forEach(letter=>{let slot=document.createElement("div");slot.className="tile-slot";let t=document.createElement("button");t.className="tile"+(letter.length>1?" long":"");t.textContent=letter;t.dataset.letter=letter;slot.appendChild(t);tiles.appendChild(slot);bind(t);});
 selectedTile=null;tip.textContent="Ċiklu "+cycleNo+": 5 ittri ġodda.";
}
function selectCell(c){answers.forEach(x=>x.classList.remove("sel"));selectedCell=c;c.classList.add("sel")}
function place(t,c){if(!t||!c)return;c.textContent=t.dataset.letter;selectCell(c);t.closest(".tile-slot").innerHTML="";selectedTile=null;let n=tiles.querySelectorAll(".tile").length;if(n)tip.textContent="Fadal "+n+" f’dan iċ-ċiklu.";else{tip.textContent="Ċiklu lest — qed jiġu 5 ittri ġodda…";setTimeout(nextFive,450)}}
answers.forEach(c=>c.onclick=()=>{selectCell(c);if(selectedTile&&document.body.contains(selectedTile))place(selectedTile,c)})
function target(x,y,t){t.style.visibility="hidden";let e=document.elementFromPoint(x,y);t.style.visibility="";return e&&e.closest?e.closest(".answer"):null}
function bind(t){
 t.onclick=()=>{if(drag&&drag.moved)return;if(selectedCell)place(t,selectedCell);else{tiles.querySelectorAll(".tile").forEach(x=>x.classList.remove("chosen"));selectedTile=t;t.classList.add("chosen");tip.textContent="Agħżel il-kaxxa għal "+t.dataset.letter+".";}};
 t.onpointerdown=e=>{drag={t,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{t.setPointerCapture(e.pointerId)}catch(_e){}};
 t.onpointermove=e=>{if(!drag||drag.t!==t)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<7)return;drag.moved=true;t.classList.add("dragging");t.style.left=(e.clientX-t.offsetWidth/2)+"px";t.style.top=(e.clientY-t.offsetHeight/2)+"px";answers.forEach(c=>c.classList.remove("drop-target"));let d=target(e.clientX,e.clientY,t);if(d)d.classList.add("drop-target");e.preventDefault()};
 t.onpointerup=e=>{if(!drag||drag.t!==t)return;let moved=drag.moved,d=moved?target(e.clientX,e.clientY,t):null;answers.forEach(c=>c.classList.remove("drop-target"));t.classList.remove("dragging");t.style.left=t.style.top="";drag=null;if(moved&&d)place(t,d)};
 t.onpointercancel=()=>{t.classList.remove("dragging");t.style.left=t.style.top="";drag=null};
}
document.getElementById("change").onclick=nextFive;
document.getElementById("erase").onclick=()=>{if(selectedCell){selectedCell.textContent="";tip.textContent="Kaxxa mbattla.";}else tip.textContent="Agħżel kaxxa l-ewwel."};
document.getElementById("hint").onclick=()=>tip.textContent="Agħfas fuq kaxxa tad-deheb biex tkabbar il-ħjiel.";
const modal=document.getElementById("modal");
document.querySelectorAll(".clue").forEach(c=>c.onclick=()=>{document.getElementById("bigIcon").textContent=c.querySelector(".ico").textContent;document.getElementById("bigClue").textContent=c.getAttribute("aria-label");document.getElementById("bigArrow").textContent=c.querySelector("b").textContent;modal.classList.add("open")});
document.getElementById("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
nextFive();
})();
</script></body></html>
