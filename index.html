function bind(t){t.addEventListener('click',()=>{if(selectedCell&&selectedCell.dataset.locked!=='1'){place(t,selectedCell);return}tiles.querySelectorAll('.tile').forEach(x=>x.classList.remove('chosen'));selectedTile=t;t.classList.add('chosen');say('Agħżel kaxxa għall-ittra '+t.dataset.letter)});
t.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&e.button!==0)return;drag={t,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{t.setPointerCapture(e.pointerId)}catch(_){}});
t.addEventListener('pointermove',e=>{if(!drag||drag.t!==t||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;ghost=document.createElement('div');ghost.className='drag-ghost';ghost.textContent=t.dataset.letter;document.body.appendChild(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=(e.clientY-55)+'px';answers.forEach(c=>c.classList.remove('drop-target'));let c=target(e.clientX,e.clientY-55);if(c)c.classList.add('drop-target');e.preventDefault()});
t.addEventListener('pointerup',e=>{if(!drag||drag.t!==t)return;let c=drag.moved?target(e.clientX,e.clientY-55):null;clearDrag();if(c)place(t,c)});t.addEventListener('pointercancel',clearDrag)}
answers.forEach(c=>{c.addEventListener('click',()=>{if(c.dataset.locked==='1'){say('Din l-ittra diġà ġiet ivverifikata.');return}select(c);if(selectedTile&&document.body.contains(selectedTile))place(selectedTile,c)});c.addEventListener('pointerdown',e=>{if(c.dataset.pending!=='1'||c.dataset.locked==='1'||(e.pointerType==='mouse'&&e.button!==0))return;drag={c,id:e.pointerId,x:e.clientX,y:e.clientY,moved:false};try{c.setPointerCapture(e.pointerId)}catch(_){}});c.addEventListener('pointermove',e=>{if(!drag||drag.c!==c||drag.id!==e.pointerId)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)<8)return;if(!drag.moved){drag.moved=true;ghost=document.createElement('div');ghost.className='drag-ghost'+(c.textContent.length>1?' long':'');ghost.textContent=c.textContent;document.body.appendChild(ghost)}ghost.style.left=e.clientX+'px';ghost.style.top=(e.clientY-55)+'px';answers.forEach(x=>x.classList.remove('drop-target'));const destination=target(e.clientX,e.clientY-55);if(destination&&destination!==c)destination.classList.add('drop-target');e.preventDefault()});c.addEventListener('pointerup',e=>{if(!drag||drag.c!==c)return;const moved=drag.moved,destination=moved?target(e.clientX,e.clientY-55):null,returning=moved&&overRack(e.clientX,e.clientY);clearDrag();if(!moved)return;if(destination&&destination!==c){const t=findTile(c.dataset.tileId);clearCell(c);place(t,destination);say('Mexxejt l-ittra. Il-punti jinħadmu biss meta tagħfas Iċċekkja.')}else if(returning){clearCell(c);selectedCell=null;answers.forEach(x=>x.classList.remove('sel'));say('L-ittra reġgħet marret isfel. Il-punti ma nbidlux.');refresh()}});c.addEventListener('pointercancel',clearDrag)});
document.getElementById('erase').onclick=()=>{if(!selectedCell||selectedCell.dataset.pending!=='1'){say('Agħżel ittra li għadek kemm poġġejt.');return}clearCell(selectedCell);selectedCell=null;answers.forEach(c=>c.classList.remove('sel'));say('L-ittra reġgħet marret isfel. Il-punti ma nbidlux.');refresh()};
document.getElementById('change').onclick=()=>{if(pending().length){say('L-ewwel agħfas Iċċekkja jew Neħħi l-ittri li poġġejt.');return}tiles.innerHTML='';selectedTile=null;refill();say('Biddilt l-ittri li kien fadal.');refresh()};
document.getElementById('verify').onclick=()=>{const cells=pending();if(!cells.length){say('Poġġi mill-inqas ittra waħda qabel Iċċekkja.');return}const completedBefore=new Set(words.filter(w=>w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i])));let good=0,bad=0;const usedAll=available().length===0&&cells.length===5;for(const c of cells){delete c.dataset.pending;if(c.textContent===solution[c.dataset.key]){good++;c.dataset.locked='1';c.classList.add('good');const spent=findTile(c.dataset.tileId);if(spent)spent.closest('.tile-slot').remove();delete c.dataset.tileId}else{bad++;c.classList.add('bad');returnTile(c);c.textContent='';c.classList.remove('long')}}const bonus=usedAll&&bad===0?5:0;const completedNow=words.filter(w=>!completedBefore.has(w)&&w.cells.every((k,i)=>byKey[k].dataset.locked==='1'&&byKey[k].textContent===w.letters[i]));const wordBonus=completedNow.reduce((sum,w)=>sum+w.letters.length,0);const turnPoints=good-bad+bonus+wordBonus;total+=turnPoints;tiles.querySelectorAll('.tile[disabled]').forEach(t=>t.closest('.tile-slot').remove());turn++;refill();selectedCell=null;answers.forEach(c=>c.classList.remove('sel'));say('Turn lest: +'+good+' korretti'+(bad?', −'+bad+' żbaljati':'')+(bonus?', +5 bonus tal-ħames ittri!':'')+(wordBonus?', +'+wordBonus+' bonus tal-kliem!':'')+'.');const done=refresh();if(done===words.length){showEnd()}else{document.getElementById('endActions').classList.remove('open');document.getElementById('card').classList.remove('pic');document.getElementById('bigClue').textContent='Punti f’dan it-turn: '+(turnPoints>=0?'+':'')+turnPoints;document.getElementById('bigArrow').textContent=(wordBonus?'Bonus tal-kliem: +'+wordBonus+' · ':'')+'Punti totali: '+total;modal.classList.add('open')}};
document.getElementById('hint').onclick=()=>{let c=selectedCell&&selectedCell.dataset.locked!=='1'?selectedCell:answers.find(x=>x.dataset.locked!=='1');if(!c)return;if(c.dataset.pending==='1')clearCell(c);c.textContent=solution[c.dataset.key];c.classList.toggle('long',c.textContent.length>1);c.dataset.locked='1';c.classList.add('good');select(c);say('Ħjiel: żvelajt ittra (bla punti).');refresh()};
function showEnd(){document.getElementById('card').classList.remove('pic');document.getElementById('bigClue').textContent='Prosit! Irbaħt u għaqqadt '+total+' punti!!';document.getElementById('bigArrow').textContent='Trid tilgħab tisliba oħra?';document.getElementById('endActions').classList.add('open');modal.classList.add('open')}
function loadPuzzle(index){activePuzzle=index;words=puzzles[index].words;solution=puzzles[index].solution;answers.forEach(c=>{c.textContent='';delete c.dataset.locked;delete c.dataset.pending;delete c.dataset.tileId;c.classList.remove('long','good','bad','sel','drop-target')});document.querySelectorAll('.clue').forEach(c=>{const w=words[+c.dataset.word];c.querySelector('span').textContent=w.clue;c.querySelector('b').textContent=w.direction==='across'?'→':'↓'});tiles.innerHTML='';selectedCell=null;selectedTile=null;turn=1;total=0;won=false;document.getElementById('endActions').classList.remove('open');modal.classList.remove('open');refill();refresh();say('Puzzle ġdida! Poġġi minn 1 sa 5 ittri, imbagħad agħfas Iċċekkja.')}
document.getElementById('solve').onclick=()=>{const userCells=pending();let good=0,bad=0;userCells.forEach(c=>{if(c.textContent===solution[c.dataset.key])good++;else bad++});total+=good-bad;answers.forEach(c=>{c.textContent=solution[c.dataset.key];c.classList.toggle('long',c.textContent.length>1);c.classList.remove('bad','sel');c.classList.add('good');c.dataset.locked='1';delete c.dataset.pending;delete c.dataset.tileId});tiles.innerHTML='';selectedCell=null;selectedTile=null;refresh();say(userCells.length?'Il-puzzle tlestiet. Ingħaddu biss l-ittri li poġġejt int.':'Il-puzzle tlestiet mingħajr punti awtomatiċi.');showEnd()};
document.getElementById('newPuzzle').onclick=()=>loadPuzzle((activePuzzle+1)%puzzles.length);document.getElementById('finishGame').onclick=()=>modal.classList.remove('open');
document.querySelectorAll('.clue').forEach(c=>c.addEventListener('click',()=>{const w=words[+c.dataset.word];document.getElementById('endActions').classList.remove('open');document.getElementById('bigClue').textContent=w.clue;document.getElementById('bigArrow').textContent=w.direction==='across'?'→':'↓';modal.classList.add('open')}));
document.getElementById('close').onclick=()=>modal.classList.remove('open');modal.onclick=e=>{if(e.target===modal)modal.classList.remove('open')};refill();refresh();say('Poġġi minn 1 sa 5 ittri, imbagħad agħfas Iċċekkja.');
})();</script>
</body></html>
