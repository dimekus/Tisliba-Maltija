<!doctype html><html lang="mt"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="color-scheme" content="light only">
<title>v23 · Tisliba Maltija — Calm Blue Palette</title>

<style>
:root{
 --bg:#24463d; --header:#17352e; --grid:#49685f;
 --answer:#fffaf0; --answerText:#263b35;
 --clue:#e0bd70; --clueText:#302819;
 --panel:#315b50; --tile:#bd633f; --tileShadow:#7b3d28;
 --accent:#f0c76d; --button:#e7ddc9; --buttonText:#263833;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Arial,sans-serif;color:#fff}
body{min-height:100dvh}
.app{min-height:100dvh;max-width:720px;margin:auto;padding:8px;display:flex;flex-direction:column;justify-content:flex-start}
header{display:flex;align-items:center;justify-content:space-between;color:#fff;margin:5px 2px 8px}
header strong{font-size:clamp(21px,6vw,30px)}
.level{background:var(--header);border:1px solid #5f7b73;border-radius:14px;padding:8px 13px;font-weight:900;font-size:clamp(15px,4vw,21px)}
.board{
 display:grid;grid-template-columns:repeat(11,minmax(0,1fr));grid-template-rows:repeat(11,minmax(0,1fr));
 width:100%;aspect-ratio:1/1;background:var(--grid);border:2px solid var(--grid);gap:1px;
}
.cell{
 width:100%;height:100%;min-width:0;min-height:0;max-width:100%;max-height:100%;
 border:0;margin:0;padding:0;position:relative;overflow:hidden;border-radius:0;
}
.answer{
 display:flex;align-items:center;justify-content:center;
 background:var(--answer);color:var(--answerText);
 font-size:clamp(14px,5vw,25px);font-weight:900;line-height:1;white-space:nowrap;
}
.answer.long{font-size:clamp(10px,3.8vw,19px)}
.answer.sel{outline:3px solid var(--accent);outline-offset:-3px;background:#fff8df}
.answer.drop-target{box-shadow:inset 0 0 0 4px var(--accent)}
.clue{background:var(--clue);color:var(--clueText);display:flex;align-items:center;justify-content:center;text-align:center;padding:2px;font-weight:900}
.clue span{font-size:clamp(5.5px,1.7vw,10px);line-height:1.02;overflow-wrap:normal;word-break:normal}
.clue.pic span{font-size:clamp(16px,5vw,28px);line-height:1}
.clue b{position:absolute;right:2px;bottom:0;font-size:clamp(9px,2vw,13px);color:#684a28}
.panel{margin-top:10px;background:var(--panel);border-radius:16px;padding:10px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;min-height:min(17vw,76px)}
.tile-slot{min-width:0;height:min(16vw,72px)}
.tile{
 width:100%;height:100%;border:0;border-radius:12px;background:var(--tile);color:#fff;
 box-shadow:0 4px 0 var(--tileShadow);font-size:clamp(21px,7vw,33px);font-weight:900;
 line-height:1;touch-action:none;user-select:none;-webkit-user-select:none;position:relative;z-index:3;
}
.tile.long{font-size:clamp(17px,5.2vw,27px)}
.tile.chosen{outline:4px solid var(--accent)}
.tile.dragging{opacity:.88;transform:scale(1.08);position:fixed;width:64px;height:64px;pointer-events:none;z-index:9999;box-shadow:0 7px 14px #0006}
.tools{display:flex;justify-content:center;gap:9px;margin-top:11px}
.tools button{border:0;border-radius:10px;padding:10px 14px;background:var(--button);color:var(--buttonText);font-weight:900;font-size:15px}
.tip{text-align:center;color:#f8f4e8;font-weight:800;margin-top:8px;font-size:14px;min-height:34px}
.modal{position:fixed;inset:0;background:#07130fd6;display:none;align-items:center;justify-content:center;z-index:10000;padding:22px}
.modal.open{display:flex}
.card{width:min(90vw,420px);min-height:190px;background:var(--clue);color:var(--clueText);border:4px solid var(--header);border-radius:18px;padding:28px;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;position:relative}
.card strong{font-size:clamp(25px,7vw,38px)} .card.pic strong{font-size:clamp(78px,22vw,120px)}
.card em{font-style:normal;font-size:34px;font-weight:900;color:#684a28;margin-top:10px}
.close{position:absolute;right:8px;top:4px;border:0;background:transparent;color:#2b261c;font-size:34px;font-weight:900}
@media(max-height:760px){.board{max-height:62dvh}.panel{margin-top:7px}}

/* v16 compact tray + visible drag ghost */
.tiles{display:flex!important;align-items:center;justify-content:center;gap:7px!important;min-height:54px!important;height:54px!important}
.tile-slot{width:48px!important;height:48px!important;min-width:48px!important;flex:0 0 48px!important}
.tile{width:48px!important;height:48px!important;border-radius:9px!important;font-size:22px!important;transform:none!important}
.tile.long{font-size:18px!important}
.drag-ghost{position:fixed;z-index:20000;pointer-events:none;width:48px;height:48px;border-radius:9px;background:var(--tile);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;box-shadow:0 4px 0 var(--tileShadow);opacity:.97;transform:translate(-50%,-100%)}
.drag-ghost.long{font-size:18px}

/* v17 final visual overrides */
body,.app{background:#24463d!important}
.board{background:#49685f!important;border-color:#49685f!important}
.answer{background:#fffaf0!important;color:#263b35!important}
.clue{background:#e0bd70!important;color:#302819!important}
.panel{background:#315b50!important}
.tile{background:#bd633f!important;box-shadow:0 4px 0 #7b3d28!important}
.drag-ghost{background:#bd633f!important;box-shadow:0 4px 0 #7b3d28!important}

/* v18 compact tiles; keep text size */
.tile-slot{width:43px!important;height:43px!important;min-width:43px!important;flex:0 0 43px!important}
.tile{width:43px!important;height:43px!important;font-size:22px!important;border-radius:8px!important}
.tile.long{font-size:18px!important}
.drag-ghost{width:43px!important;height:43px!important;font-size:22px!important;border-radius:8px!important}
.drag-ghost.long{font-size:18px!important}

/* Direct cell rules: light palette, no inherited dark cell background */
.board .answer{background-color:#fffaf0!important;background:#fffaf0!important;color:#263b35!important}
.board .clue{background-color:#e0bd70!important;background:#e0bd70!important;color:#302819!important}
.board{background-color:#49685f!important}

/* v19 — palette correction based on actual rendered grid */
.board .cell{
  background:#fff7e6 !important;
  background-color:#fff7e6 !important;
  color:#263b35 !important;
}
.board .cell.clue,
.board .clue{
  background:#e2bd69 !important;
  background-color:#e2bd69 !important;
  color:#2d281d !important;
}
.board .cell.answer,
.board .answer{
  background:#fff7e6 !important;
  background-color:#fff7e6 !important;
  color:#263b35 !important;
}
/* Keep borders/grid dark green */
.board{background:#36534c !important;background-color:#36534c !important}
.board .cell{border-color:#36534c !important}

/* v20 — prevent Android/Chrome/Samsung automatic darkening of game colours */
:root{color-scheme:only light!important}
html,body,.app,.board,.cell,.panel,.tile,.tools button{
  forced-color-adjust:none!important;
}
.board .cell.answer{
  background-color:rgb(255,247,230)!important;
  color:rgb(38,59,53)!important;
}
.board .cell.clue{
  background-color:rgb(226,189,105)!important;
  color:rgb(45,40,29)!important;
}

/* v22 — use real PNG pixels, not CSS colours/gradients, to bypass forced dark rendering */
.board .cell.answer{
 background-color:#fff7e6!important;
 background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGP4//0ZAAXVAt3d+mnJAAAAAElFTkSuQmCC")!important;
 background-repeat:repeat!important;
 background-size:100% 100%!important;
 color:#263b35!important;
}
.board .cell.clue{
 background-color:#e2bd69!important;
 background-image:url("data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGN4tDcTAASNAgldA1o+AAAAAElFTkSuQmCC")!important;
 background-repeat:repeat!important;
 background-size:100% 100%!important;
 color:#2d281d!important;
}
.board .cell.answer.sel{
 outline:3px solid #f0c76d!important;
 outline-offset:-3px!important;
}

/* v23 — calm navy / blue-grey / cream palette; preserve existing gameplay */
:root{--bg:#102b40;--header:#203e57;--grid:#27455c;--answer:#f7efdd;--answerText:#142d43;--clue:#9bb6c7;--clueText:#19364c;--panel:#1c3a53;--tile:#f5e7cb;--tileShadow:#b4a58b;--accent:#e9bd68;--button:#345f87;--buttonText:#fff}
html,body,body .app{background:#102b40!important;color:#f7f7f4!important}
.level{background:#294963!important;border-color:#7198b3!important;color:#fff!important}
.board{background:#27455c!important;background-color:#27455c!important;border-color:#6089a6!important;border-radius:9px;overflow:hidden}
.board .cell.answer{background:#f7efdd!important;background-color:#f7efdd!important;background-image:none!important;color:#142d43!important}
.board .cell.clue{background:#9bb6c7!important;background-color:#9bb6c7!important;background-image:none!important;color:#19364c!important}
.board .cell.clue b{color:#fff!important}
.board .cell.answer.sel{background:#fff4d9!important;outline:3px solid #e9bd68!important}
.panel{background:#1c3a53!important;border-radius:20px!important}
.tile,.drag-ghost{background:#f5e7cb!important;color:#142d43!important;box-shadow:0 4px 0 #b4a58b!important}
.tile.chosen{outline-color:#e9bd68!important}
.tools button{background:#345f87!important;color:#fff!important}
.tools #erase{background:#ad5446!important}
.tools #hint{background:#d99d3f!important;color:#172c3c!important}
.tip{color:#dce8f0!important}
.card{background:#9bb6c7!important;color:#19364c!important;border-color:#27455c!important}
.card em,.close{color:#19364c!important}
</style>
</head><body><main class="app">

e="button" data-key="2,9"></button><button class="cell answer" type="button" data-key="2,10"></button><div class="cell clue "><span>Raħal</span><b>→</b></div><button class="cell answer" type="button" data-key="3,1"></button><div class="cell clue pic"><span>🥛</span><b>→</b></div><button class="cell answer" type="button" data-key="3,3"></button><button class="cell answer" type="button" data-key="3,4"></button><button class="cell answer" type="button" data-key="3,5"></button><button class="cell answer" type="button" data-key="3,6"></button><button class="cell answer" type="button" data-key="3,7"></button><button class="cell answer" type="button" data-key="3,8"></button><div class="cell clue "><span>Omm</span><b>→</b></div><button class="cell answer" type="button" data-key="3,10"></button><div class="cell clue "><span>Triq</span><b>→</b></div><button class="cell answer" type="button" data-key="4,1"></button><button class="cell answer" type="button" data-key="4,2"></button><button class="cell answer" type="button" data-key="4,3"></button><div class="cell clue "><span>Għajn</span><b>→</b></div><button class="cell answer" type="button" data-key="4,5"></button><button class="cell answer" type="button" data-key="4,6"></button><button class="cell answer" type="button" data-key="4,7"></button><button class="cell answer" type="button" data-key="4,8"></button><button class="cell answer" type="button" data-key="4,9"></button><button class="cell answer" type="button" data-key="4,10"></button><div class="cell clue "><span>Ħobż</span><b></b></div><div class="cell clue "><span>Siġra</span><b>→</b></div><button class="cell answer" type="button" data-key="5,2"></button><button class="cell answer" type="button" data-key="5,3"></button><button class="cell answer" type="button" data-key="5,4"></button><button class="cell answer" type="button" data-key="5,5"></button><div class="cell clue "><span>Xemx</span><b>→</b></div><button class="cell answer" type="button" data-key="5,7"></button><button class="cell answer" type="button" data-key="5,8"></button><button class="cell answer" type="button" data-key="5,9"></button><div class="cell clue "><span>Malta</span><b>↓</b></div><div class="cell clue "><span>Ħut</span><b>→</b></div><button class="cell answer" type="button" data-key="6,1"></button><button class="cell answer" type="button" data-key="6,2"></button><div class="cell clue "><span>Dar</span><b>→</b></div><button class="cell answer" type="button" data-key="6,4"></button><button class="cell answer" type="button" data-key="6,5"></button><button class="cell answer" type="button" data-key="6,6"></button><button class="cell answer" type="button" data-key="6,7"></button><div class="cell clue "><span>Għasel</span><b>→</b></div><button class="cell answer" type="button" data-key="6,9"></button><button class="cell answer" type="button" data-key="6,10"></button><div class="cell clue "><span>Skola</span><b>→</b></div><button class="cell answer" type="button" data-key="7,1"></button><button class="cell answer" type="button" data-key="7,2"></button><button class="cell answer" type="button" data-key="7,3"></button><button class="cell answer" type="button" data-key="7,4"></button><div class="cell clue "><span>Missier</span><b>→</b></div><button class="cell answer" type="button" data-key="7,6"></button><button class="cell answer" type="button" data-key="7,7"></button><button class="cell answer" type="button" data-key="7,8"></button><button class="cell answer" type="button" data-key="7,9"></button><button class="cell answer" type="button" data-key="7,10"></button><div class="cell clue "><span>Melħ</span><b>→</b></div><button class="cell answer" type="button" data-key="8,1"></button><div class="cell clue pic"><span>🍊</span><b>→</b></div><button class="cell answer" type="button" data-key="8,3"></button><button class="cell answer" type="button" data-key="8,4"></button><button class="cell answer" type="button" data-key="8,5"></button><button class="cell answer" type="button" data-key="8,6"></button><div class="cell clue pic"><span>⛵</span><b>→</b></div><button class="cell answer" type="button" data-key="8,8"></button><button class="cell answer" type="button" data-key="8,9"></button><button class="cell answer" type="button" data-key="8,10"></button><div class="cell clue pic"><span>🐝</span><b>→</b></div><button class="cell answer" type="button" data-key="9,1"></button><button class="cell answer" type="button" data-key="9,2"></button><button class="cell answer" type="button" data-key="9,3"></button><div class="cell clue pic"><span>🌊</span><b>→</b></div><button class="cell answer" type="button" data-key="9,5"></button><button class="cell answer" type="button" data-key="9,6"></button><button class="cell answer" type="button" data-key="9,7"></button><button class="cell answer" type="button" data-key="9,8"></button><div class="cell clue pic"><span>🪟</span><b>→</b></div><button class="cell answer" type="button" data-key="9,10"></button><div class="cell clue pic"><span>🐶</span><b>→</b></div><button class="cell answer" type="button" data-key="10,1"></button><button class="cell answer" type="button" data-key="10,2"></button><button class="cell answer" type="button" data-key="10,3"></button><button class="cell answer" type="button" data-key="10,4"></button><button class="cell answer" type="button" data-key="10,5"></button><div class="cell clue pic"><span>🍊</span><b>→</b></div><button class="cell answer" type="button" data-key="10,7"></button><button class="cell answer" type="button" data-key="10,8"></button><button class="cell answer" type="button" data-key="10,9"></button><button class="cell answer" type="button" data-key="10,10"></button></section>

  <button class="close" id="close">×</button>

 </div>
</div>

<script>
(()=>{"use strict";
const tiles=document.getElementById("tiles"),tip=document.getElementById("tip"),answers=[...document.querySelectorAll(".answer")];
const cycles=[["A","GĦ","IE","R","T"],["M","A","L","T","A"],["Ħ","O","B","Ż","S"],["Q","A","T","T","U"],["S","I","Ġ","R","A"],["B","A","Ħ","A","R"],["GĦ","A","S","E","L"],["K","E","L","B","IE"]];
let ci=0,selectedCell=null,selectedTile=null,drag=null,ghost=null;
const msg=x=>tip.textContent=x;
function select(c){answers.forEach(x=>x.classList.remove("sel"));selectedCell=c;c.classList.add("sel")}
function place(t,c){if(!t||!c)return;c.textContent=t.dataset.letter;c.classList.toggle("long",t.dataset.letter.length>1);select(c);t.closest(".tile-slot").innerHTML="";selectedTile=null;let n=tiles.querySelectorAll(".tile").length;if(n)msg("Fadal "+n+(n===1?" ittra":" ittri")+" f’dan iċ-ċiklu.");else{msg("Ċiklu lest — 5 ittri ġodda.");setTimeout(next,400)}}
function next(){let arr=cycles[ci%cycles.length];ci++;tiles.innerHTML="";arr.forEach(letter=>{let slot=document.createElement("div");slot.className="tile-slot";let t=document.createElement("button");t.type="button";t.className="tile"+(letter.length>1?" long":"");t.dataset.letter=letter;t.textContent=letter;slot.appendChild(t);tiles.appendChild(slot);bind(t)});selectedTile=null;msg("Ċiklu "+ci+": 5 ittri.")}
function target(x,y){let e=document.elementFromPoint(x,y);return e&&e.closest?e.closest(".answer"):null}
function makeGhost(t,x,y){ghost=document.createElement("div");ghost.className="drag-ghost"+(t.dataset.letter.length>1?" long":"");ghost.textContent=t.dataset.letter;document.body.appendChild(ghost);moveGhost(x,y)}
function moveGhost(x,y){if(ghost){ghost.style.left=x+"px";ghost.style.top=(y-54)+"px"}}
function clear(){answers.forEach(c=>c.classList.remove("drop-target"));if(ghost){ghost.remove();ghost=null}drag=null}
function bind(t){
 t.addEventListener("click",()=>{if(drag&&drag.moved)return;if(selectedCell){place(t,selectedCell);return}tiles.querySelectorAll(".tile").forEach(x=>x.classList.remove("chosen"));selectedTile=t;t.classList.add("chosen");msg("Agħżel il-kaxxa għal "+t.dataset.letter+".")});
 t.addEventListener("pointerdown",e=>{if(e.pointerType==="mouse"&&e.button!==0)return;drag={t,id:e.pointerId,moved:false};makeGhost(t,e.clientX,e.clientY);try{t.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});
 t.addEventListener("pointermove",e=>{if(!drag||drag.t!==t||drag.id!==e.pointerId)return;drag.moved=true;moveGhost(e.clientX,e.clientY);answers.forEach(c=>c.classList.remove("drop-target"));let d=target(e.clientX,e.clientY-78);if(d)d.classList.add("drop-target");e.preventDefault()});
 t.addEventListener("pointerup",e=>{if(!drag||drag.t!==t)return;let moved=drag.moved,d=target(e.clientX,e.clientY-78);clear();if(moved&&d)place(t,d)});
 t.addEventListener("pointercancel",clear);
}
answers.forEach(c=>c.addEventListener("click",()=>{select(c);if(selectedTile&&document.body.contains(selectedTile))place(selectedTile,c)}));
document.getElementById("change").onclick=next;
document.getElementById("erase").onclick=()=>{if(selectedCell){selectedCell.textContent="";selectedCell.classList.remove("long");msg("L-ittra tneħħiet.")}else msg("Agħżel kaxxa l-ewwel.")};
document.getElementById("hint").onclick=()=>msg("Agħfas fuq ħjiel fil-grid biex tkabbru.");
const modal=document.getElementById("modal"),card=document.getElementById("card");
document.querySelectorAll(".clue").forEach(c=>c.addEventListener("click",()=>{let sp=c.querySelector("span"),ar=c.querySelector("b");document.getElementById("bigClue").textContent=sp?sp.innerText.replace(/\n/g," "):"";document.getElementById("bigArrow").textContent=ar?ar.innerText:"";card.classList.toggle("pic",c.classList.contains("pic"));modal.classList.add("open")}));
document.getElementById("close").onclick=()=>modal.classList.remove("open");modal.onclick=e=>{if(e.target===modal)modal.classList.remove("open")};
next();
})();
</script>
